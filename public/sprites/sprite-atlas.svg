  <!-- Tile 0 (0..55): 80s Testarossa Spider Rear View (Frame 0) -->
  <g transform="translate(6, 12)">
    <rect x="2" y="36" width="44" height="4" fill="#18082c" />
    <rect x="0" y="26" width="8" height="12" fill="#12091f" />
    <rect x="40" y="26" width="8" height="12" fill="#12091f" />
    <rect x="2" y="16" width="44" height="14" fill="#ff2a6d" />
