    <rect x="5" y="10" width="28" height="8" fill="#d91b5c" />
    <rect x="9" y="4" width="24" height="6" fill="#180a2e" />
    <rect x="3" y="19" width="30" height="4" fill="#140624" />
    <rect x="4" y="20" width="9" height="2" fill="#fff3b0" />
    <rect x="23" y="20" width="9" height="2" fill="#fff3b0" />
  </g>

