    <!-- Exposed Side Flank with Pininfarina Strakes & Front/Rear Alloy Wheels -->
    <polygon points="34,36 54,26 52,16 32,16" fill="#e01e60" />
    <line x1="36" y1="22" x2="50" y2="18" stroke="#240b36" stroke-width="2" />
    <line x1="36" y1="26" x2="50" y2="22" stroke="#240b36" stroke-width="2" />
    <rect x="36" y="27" width="5" height="9" fill="#12091f" />
    <rect x="37" y="29" width="3" height="5" fill="#05d9e8" />
    <rect x="47" y="21" width="5" height="8" fill="#12091f" />
    <rect x="48" y="23" width="3" height="4" fill="#05d9e8" />
