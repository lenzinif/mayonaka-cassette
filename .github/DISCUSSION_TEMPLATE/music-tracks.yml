title: "[Track]: "
labels: ["music", "beatmap", "road-generation"]
body:
  - type: input
    id: song-title-artist
    attributes:
      label: Track title and artist
      placeholder: e.g. Macross 82-99 - Fun Tonight
    validations:
      required: true
  - type: input
    id: detected-bpm
    attributes:
      label: Detected BPM vs. actual BPM (if known)
      placeholder: e.g. Detected at 124 BPM (correct), or 62 BPM instead of 124
    validations:
      required: false
  - type: textarea
    id: road-feel
    attributes:
      label: Generated road behavior
      placeholder: e.g. The downhill drop at 1:15 lines up great; the curves in the breakdown feel too tight...
    validations:
      required: true
