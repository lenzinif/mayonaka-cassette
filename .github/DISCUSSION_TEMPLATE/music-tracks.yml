title: "[Track]: "
labels: ["music", "beatmap", "road-generation"]
body:
  - type: input
    id: song-title-artist
    attributes:
      label: Titolo del brano e artista
      placeholder: Es. Macross 82-99 - Fun Tonight
    validations:
      required: true
  - type: input
    id: detected-bpm
    attributes:
      label: BPM rilevato rispetto al BPM reale (se noto)
      placeholder: Es. Rilevato a 124 BPM (corretto), oppure a 62 BPM anziché 124
    validations:
      required: false
  - type: textarea
    id: road-feel
    attributes:
      label: Comportamento della strada generata
      placeholder: Es. La discesa sul drop al minuto 1:15 coincide bene; le curve nel breakdown risultano troppo strette...
    validations:
      required: true
