title: "[Idea]: "
labels: ["enhancement", "idea"]
body:
  - type: input
    id: idea-summary
    attributes:
      label: Proposta in sintesi
      placeholder: Es. Aggiungere un tracciato autostradale sotto la pioggia con riflessi al neon
    validations:
      required: true
  - type: textarea
    id: idea-details
    attributes:
      label: Descrizione
      placeholder: Spiega il funzionamento e come si inserisce nel gioco...
    validations:
      required: true
  - type: textarea
    id: visual-references
    attributes:
      label: Riferimenti visivi o musicali (opzionale)
      placeholder: Link a video, brani musicali o immagini di riferimento...
