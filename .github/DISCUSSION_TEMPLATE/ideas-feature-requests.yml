title: "[Idea]: "
labels: ["enhancement", "idea"]
body:
  - type: input
    id: idea-summary
    attributes:
      label: Summary
      placeholder: e.g. Add a rainy highway stage with neon reflections
    validations:
      required: true
  - type: textarea
    id: idea-details
    attributes:
      label: Description
      placeholder: Explain how it works and how it fits into the game...
    validations:
      required: true
  - type: textarea
    id: visual-references
    attributes:
      label: Visual or musical references (optional)
      placeholder: Links to videos, music tracks, or reference images...
