title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### 🐛 Bug Report
        To help us reproduce, track, and fix technical issues quickly, please use our official **Issue Tracker**:

        👉 **[Open a Bug Report on GitHub Issues](https://github.com/lenzinif/mayonaka-cassette/issues/new?template=bug_report.yml)**

        If you prefer to discuss it here with the community before opening a ticket, you can fill out the fields below.
  - type: textarea
    id: bug-summary
    attributes:
      label: Problem description
      placeholder: What happened, and what did you expect to happen instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device (optional)
      placeholder: e.g. Chrome 124 on Windows 11, 144 Hz display
    validations:
      required: false
