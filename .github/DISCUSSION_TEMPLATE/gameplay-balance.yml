title: "[Balance]: "
labels: ["balance", "feedback"]
body:
  - type: dropdown
    id: mechanic
    attributes:
      label: Elemento da discutere
      options:
        - Beat-shift e finestre temporali (PERFECT / GOOD)
        - Fisica melon soda e Tofu Mode (sensibilità al jerk e sversamento)
        - Tenuta e controsterzo in derapata
        - Rapporti del cambio e velocità di punta
        - Traffico kei truck e collisioni
        - Sincronia strada-musica (drop e bivi)
        - Altro
    validations:
      required: true
  - type: textarea
    id: current-feel
    attributes:
      label: Comportamento attuale durante la guida
      placeholder: Es. In 3ª marcia il controsterzo fa traboccare la soda troppo facilmente, oppure i kei truck compaiono troppo tardi dopo le curve cieche...
    validations:
      required: true
  - type: textarea
    id: proposed-tuning
    attributes:
      label: Modifica suggerita
      placeholder: Es. Aumentare la tolleranza del GOOD su schermi a 60 Hz, oppure ammorbidire lo smorzamento della soda...
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Periferica e sistema (opzionale)
      placeholder: Es. Tastiera USB, controller Xbox, schermo 144 Hz, Chrome su Windows
