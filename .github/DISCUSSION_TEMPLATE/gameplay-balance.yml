title: "[Balance]: "
labels: ["balance", "feedback"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie per aiutarci a perfezionare il feeling arcade di **Mayonaka Cassette**!
        Condividi le tue impressioni sulle sensazioni di guida, sulla tolleranza dei ritmi e sul bilanciamento generale.
  - type: dropdown
    id: mechanic
    attributes:
      label: Quale meccanica o elemento desideri discutere?
      options:
        - Beat-shift & finestre temporali (PERFECT / GOOD)
        - Fisica Melon Soda & Tofu Mode (sensibilità al jerk/sversamento)
        - Tenuta, sovrasterzo e controsterzo in derapata
        - Curva di coppia marce e velocità di punta
        - Traffico Kei truck & tolleranza collisioni
        - Sincronia ibrida strada-musica (Drop/Bivio)
        - Altro
    validations:
      required: true
  - type: textarea
    id: current-feel
    attributes:
      label: Come si sente attualmente durante la guida?
      placeholder: Es. "In 3ª marcia il controsterzo fa schizzare la soda troppo facilmente..." oppure "I Kei truck spuntano troppo vicini all'uscita della curva..."
    validations:
      required: true
  - type: textarea
    id: proposed-tuning
    attributes:
      label: Quale bilanciamento o ritocco suggerisci?
      placeholder: Es. "Aumentare leggermente la tolleranza del GOOD su schermi a 60Hz" o "Ammorbidire lo smorzamento della soda".
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Periferica e Sistema (opzionale)
      placeholder: Es. Tastiera USB / Gamepad Xbox / Display 144Hz / Chrome su Windows
