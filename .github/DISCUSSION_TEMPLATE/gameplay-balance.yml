title: "[Balance]: "
labels: ["balance", "feedback"]
body:
  - type: dropdown
    id: mechanic
    attributes:
      label: Mechanic to discuss
      options:
        - Beat-shift and timing windows (PERFECT / GOOD)
        - Melon Soda physics and Tofu Mode (jerk sensitivity and spilling)
        - Drift grip and counter-steering
        - Gear ratios and top speed
        - Kei truck traffic and collisions
        - Road-music sync (drops and stage forks)
        - Other
    validations:
      required: true
  - type: textarea
    id: current-feel
    attributes:
      label: Current driving feel
      placeholder: e.g. In 3rd gear, counter-steering makes the soda spill too easily, or kei trucks appear too late after blind corners...
    validations:
      required: true
  - type: textarea
    id: proposed-tuning
    attributes:
      label: Suggested tweak
      placeholder: e.g. Widen the GOOD timing window on 60 Hz displays, or soften the soda damping...
    validations:
      required: false
  - type: input
    id: environment
    attributes:
      label: Input device and system (optional)
      placeholder: e.g. USB keyboard, Xbox controller, 144 Hz display, Chrome on Windows
