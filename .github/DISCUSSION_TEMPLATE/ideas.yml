title: "[Idea]: "
labels: ["enhancement", "idea"]
body:
  - type: markdown
    attributes:
      value: |
        Hai un'idea per rendere **Mayonaka Cassette** ancora più ricco, stiloso o divertente?
        Condividi suggerimenti su nuove feature, biomi, arredo urbano, personalizzazioni o chicche Future Funk!
  - type: input
    id: idea-summary
    attributes:
      label: In breve: qual è la tua proposta?
      placeholder: Es. "Aggiungere un bioma autostradale sotto la pioggia con riflessi al neon"
    validations:
      required: true
  - type: textarea
    id: idea-details
    attributes:
      label: Descrizione dettagliata
      placeholder: Spiega come dovrebbe funzionare e perché si adatterebbe allo spirito arcade di Mayonaka Cassette...
    validations:
      required: true
  - type: textarea
    id: visual-references
    attributes:
      label: Riferimenti estetici o musicali (opzionale)
      placeholder: Link a video, canzoni Future Funk, screenshot di anime anni '80 o vecchi arcade Sega...
