name: Segnalazione bug
description: Segnala un malfunzionamento, un difetto visivo o un problema tecnico.
labels: ["bug"]
body:
  - type: textarea
    id: bug-description
    attributes:
      label: Cosa è successo?
      placeholder: Descrivi il problema e il comportamento atteso...
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Passaggi per riprodurre il problema
      placeholder: |
        1. Premi Play
        2. Carica il brano X
        3. Premi Shift alla battuta Y...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser e sistema operativo
      placeholder: Es. Chrome 124 su Windows 11, display 144 Hz
    validations:
      required: true
  - type: textarea
    id: console-errors
    attributes:
      label: Eventuali errori nella console (F12)
      render: shell
