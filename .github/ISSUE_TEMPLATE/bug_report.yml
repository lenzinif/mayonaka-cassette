name: Bug Report
description: Report a bug, visual glitch, or technical issue.
labels: ["bug"]
body:
  - type: textarea
    id: bug-description
    attributes:
      label: What happened?
      placeholder: Describe the issue and the expected behavior...
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Press Play
        2. Load track X
        3. Press Shift on beat Y...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 124 on Windows 11, 144 Hz display
    validations:
      required: true
  - type: textarea
    id: console-errors
    attributes:
      label: Console errors (F12), if any
      render: shell
